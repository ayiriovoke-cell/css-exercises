<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix the Cascade</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="bigpara">I'm just a paragraph with extra bold text!</p>
    <p class="smallpara">I'm a smaller paragraph with extra bold text!</p>
    <div>
      <button class="green">Confirm</button>
      <button class="default">Cancel</button>
    </div>
    <div class="thintext">
      <div class="thin">I'm a div with thin text!</div>
      <div class="thin">I'm a div with thin text and a child div!</div>
    </div>
    <div id="smalldiv">
      I'm  a smaller div with bold text.
    </div>
  </body>
</html>
